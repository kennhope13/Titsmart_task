name: Build Electron App (Windows)

on:
  push:
    branches: [ "main", "fix/excel-import-logic-sync" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      working-directory: ./web-admin
      run: npm install

    - name: Get App Version
      id: version
      working-directory: ./web-admin
      run: Write-Output ("version=" + (node -p "require('./package.json').version")) >> $env:GITHUB_ENV

    - name: Build Electron App
      working-directory: ./web-admin
      run: npm run build:electron -- --publish never

    - name: Upload Build Artifacts (.exe + update files)
      uses: actions/upload-artifact@v4
      with:
        name: TITSMART-Setup-Windows
        path: |
          web-admin/release/*.exe
          web-admin/release/*.exe.blockmap
          web-admin/release/latest.yml
        retention-days: 7

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        name: TITSMART Project Manager v${{ env.version }}
        tag_name: v${{ env.version }}
        body: |
          Phiên bản **v${{ env.version }}** của TITSMART Project Manager
          Bản cập nhật này bao gồm các tính năng và bản vá lỗi mới nhất.
        generate_release_notes: true
        files: |
          web-admin/release/*.exe
          web-admin/release/*.exe.blockmap
          web-admin/release/latest.yml
        update_release: true
        fail_on_unmatched_files: false

    - name: Generate Email Body
      if: success()
      run: |
        node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('./web-admin/public/version.json', 'utf8')); const version = data.version; const notes = data.notes.map(n => '<li>' + n + '</li>').join(''); const repo = process.env.GITHUB_REPOSITORY; const downloadLink = 'https://github.com/' + repo + '/releases/tag/v' + version; const html = '<h2>TITSMART Project Manager - Thông báo cập nhật phần mềm</h2><p>Chào bạn,</p><p>Hệ thống đã phát hành thành công phiên bản <strong>v' + version + '</strong>.</p><h3>Nội dung cập nhật / Fix lỗi:</h3><ul>' + notes + '</ul><p><strong>🔗 Link tải xuống phiên bản mới:</strong> <a href=\"' + downloadLink + '\">' + downloadLink + '</a></p><br><p>Trân trọng,<br>Hệ thống tự động TITSMART</p>'; fs.writeFileSync('mail_body.html', html);"

    - name: Send Notification Email
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: mail90168.maychuemail.com
        server_port: 465
        secure: true
        username: "kythuat@titsmart.vn"
        password: "Vcuong1@"
        subject: "[TITSMART] Phần mềm quản lý dự án đã có bản cập nhật mới v${{ env.version }}"
        to: kythuat@titsmart.vn
        from: Hệ thống TITSMART <kythuat@titsmart.vn>
        html_body: file://mail_body.html
