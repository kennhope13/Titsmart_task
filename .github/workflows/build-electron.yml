name: Build Electron & Android App

on:
  push:
    branches: [ "main", "fix/excel-import-logic-sync" ]

permissions:
  contents: write

jobs:
  build-electron:
    name: Build Electron Windows App
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      working-directory: ./web-admin
      run: npm install

    - name: Get App Version
      id: version
      working-directory: ./web-admin
      run: Write-Output ("version=" + (node -p "require('./package.json').version")) >> $env:GITHUB_ENV

    - name: Build Electron App
      working-directory: ./web-admin
      env:
        VITE_SUPABASE_URL: "https://nvdonaaxbtqjfmxtlgzb.supabase.co"
        VITE_SUPABASE_ANON_KEY: "sb_publishable_gzUeVF_f2jadDuuii66pCw_W_0xmqjg"
      run: npm run build:electron -- --publish never

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TITSMART-Setup-Windows
        path: |
          web-admin/release/*.exe
          web-admin/release/*.exe.blockmap
          web-admin/release/latest.yml
        retention-days: 7

    - name: Publish Windows Release
      uses: softprops/action-gh-release@v2
      with:
        name: TITSMART Project Manager v${{ env.version }}
        tag_name: v${{ env.version }}
        body: |
          Phiên bản **v${{ env.version }}** của TITSMART Project Manager (Bản cài đặt Windows & Android APK).
        generate_release_notes: true
        files: |
          web-admin/release/*.exe
          web-admin/release/*.exe.blockmap
          web-admin/release/latest.yml
        update_release: true
        fail_on_unmatched_files: false

  build-android:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Web-Admin Dependencies
      working-directory: ./web-admin
      run: npm install

    - name: Get App Version
      id: version
      working-directory: ./web-admin
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

    - name: Build Web Mobile Bundle & Sync Capacitor
      working-directory: ./web-admin
      env:
        VITE_SUPABASE_URL: "https://nvdonaaxbtqjfmxtlgzb.supabase.co"
        VITE_SUPABASE_ANON_KEY: "sb_publishable_gzUeVF_f2jadDuuii66pCw_W_0xmqjg"
      run: |
        npx vite build --config vite.config.mobile.ts --mode production
        npx cap sync android

    - name: Make Gradlew Executable
      working-directory: ./web-admin/android
      run: chmod +x gradlew

    - name: Build Android Debug APK
      working-directory: ./web-admin/android
      run: ./gradlew assembleDebug --no-daemon

    - name: Rename APK File
      run: |
        cp web-admin/android/app/build/outputs/apk/debug/app-debug.apk TITSMART-v${{ env.version }}.apk

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TITSMART-Android-v${{ env.version }}
        path: TITSMART-v${{ env.version }}.apk

    - name: Attach APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.version }}
        files: |
          TITSMART-v${{ env.version }}.apk
        update_release: true
        fail_on_unmatched_files: false

  send-email:
    name: Send Email Notification
    needs: [build-electron, build-android]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Generate Email Body
      run: node generate_mail.js

    - name: Send Notification Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: mail90168.maychuemail.com
        server_port: 465
        secure: true
        username: "kythuat@titsmart.vn"
        password: "Vcuong1@"
        subject: "[TITSMART] Phần mềm quản lý dự án đã có bản cập nhật mới"
        to: kythuat@titsmart.vn
        from: Hệ thống TITSMART <kythuat@titsmart.vn>
        html_body: file://mail_body.html

