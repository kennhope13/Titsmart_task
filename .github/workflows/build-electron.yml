name: Build Electron App (Windows)

on:
  push:
    branches: [ "main", "fix/excel-import-logic-sync" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      working-directory: ./web-admin
      run: npm install

    - name: Get App Version
      id: version
      working-directory: ./web-admin
      run: Write-Output ("version=" + (node -p "require('./package.json').version")) >> $env:GITHUB_ENV

    - name: Build Electron App
      working-directory: ./web-admin
      run: npm run build:electron -- --publish never

    - name: Upload Build Artifacts (.exe + update files)
      uses: actions/upload-artifact@v4
      with:
        name: TITSMART-Setup-Windows
        path: |
          web-admin/release/*.exe
          web-admin/release/*.exe.blockmap
          web-admin/release/latest.yml
        retention-days: 7

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        name: TITSMART Project Manager v${{ env.version }}
        tag_name: v${{ env.version }}
        body: |
          Phiên bản **v${{ env.version }}** của TITSMART Project Manager
          Bản cập nhật này bao gồm các tính năng và bản vá lỗi mới nhất.
        generate_release_notes: true
        files: |
          web-admin/release/*.exe
          web-admin/release/*.exe.blockmap
          web-admin/release/latest.yml
        update_release: true
        fail_on_unmatched_files: false

    - name: Generate Email Body
      if: success()
      run: node generate_mail.js

    - name: Send Notification Email
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: mail90168.maychuemail.com
        server_port: 465
        secure: true
        username: "kythuat@titsmart.vn"
        password: "Vcuong1@"
        subject: "[TITSMART] Phần mềm quản lý dự án đã có bản cập nhật mới v${{ env.version }}"
        to: kythuat@titsmart.vn
        from: Hệ thống TITSMART <kythuat@titsmart.vn>
        html_body: file://mail_body.html
