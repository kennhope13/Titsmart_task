name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, feature/ios-build-capacitor ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd web-admin
          npm install

      - name: Build Web & Add Capacitor iOS
        run: |
          cd web-admin
          npm run build:mobile
          npx cap add ios
          npx cap sync ios

      - name: Build iOS App Archive
        run: |
          cd web-admin/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive -archivePath App.xcarchive

      - name: Export Unsigned IPA
        run: |
          cd web-admin/ios/App
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r App.ipa Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TITSMART-iOS-App
          path: web-admin/ios/App/App.ipa
