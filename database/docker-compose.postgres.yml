version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: titsmart_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: titsmart_work_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seeds/001_seed_core.sql:/docker-entrypoint-initdb.d/02_seed.sql

volumes:
  postgres_data:
