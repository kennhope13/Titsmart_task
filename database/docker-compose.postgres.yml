services:
  postgres:
    image: postgres:16-alpine
    container_name: titsmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: titsmart_work_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - titsmart_postgres_data:/var/lib/postgresql/data

volumes:
  titsmart_postgres_data:
